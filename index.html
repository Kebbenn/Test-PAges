<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina di prova</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --card: #1b2027;
        --text: #e4e7eb;
        --muted: #9aa5b1;
        --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #risultato { margin-top: 20px; font-weight: 600; min-height: 1.5em; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pagina di prova</h1>
    <p>Questa è una pagina semplice, fatta solo per un test.</p>
    <button id="bottone" type="button">Premi qui</button>
    <div id="risultato" aria-live="polite"></div>
  </main>
  <script>
    let volte = 0;
    document.getElementById('bottone').addEventListener('click', function () {
      volte++;
      document.getElementById('risultato').textContent =
        'Funziona! Hai premuto ' + volte + (volte === 1 ? ' volta.' : ' volte.');
    });
  </script>
</body>
</html>
