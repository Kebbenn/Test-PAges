name: Scopri argomenti virali

on:
  schedule:
    - cron: '17 5 * * *'   # ogni mattina alle 5:17 UTC (6:17 o 7:17 in Italia)
  workflow_dispatch:        # permette di farlo partire a mano dalla scheda "Actions"

permissions:
  contents: write

concurrency:
  group: scopri
  cancel-in-progress: false

jobs:
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cerca gli argomenti virali
        run: node scripts/scopri.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Salva la classifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoperte
          if git diff --cached --quiet; then
            echo "Niente di nuovo da salvare"
          else
            git commit -m "Classifica argomenti virali del $(TZ=Europe/Rome date +%d/%m/%Y)"
            git push
          fi
